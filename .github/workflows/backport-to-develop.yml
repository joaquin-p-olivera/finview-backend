name: Backport to develop

# After a hotfix lands directly on master, opens a PR bringing it back into
# develop so the two branches don't drift apart.
on:
  push:
    branches: [master]

jobs:
  backport:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if there is anything to backport
        id: diff
        run: |
          git fetch origin develop
          if git diff --quiet origin/develop origin/master; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create backport PR
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="backport/master-to-develop-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --base develop \
            --head "$BRANCH_NAME" \
            --title "Backport master to develop" \
            --body "Automated backport after a release/hotfix merge to master." \
            || echo "Backport PR already exists, skipping"
