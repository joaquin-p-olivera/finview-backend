name: Keep API awake

# Render's free instances sleep after 15 minutes without traffic, and the
# first request after that (usually the login) waits for a cold start. This
# pings /health every 10 minutes between 08:00 and 24:00 Uruguay time
# (11:00-03:00 UTC) so the API is already up when the app is used, while
# leaving it asleep overnight to save free instance hours.
# Scheduled workflows only run from the default branch (develop). GitHub may
# delay scheduled runs at busy times, so this is best effort.
on:
  schedule:
    - cron: '*/10 0-2,11-23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://finview-backend-1hwo.onrender.com/health' }}
        run: curl --fail --silent --show-error --retry 2 --max-time 90 "$HEALTH_URL"
